name: Deploy Automático KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Sincronizar com KingHost
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sincronizar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .agents/**
            server.js
            abrir_site.bat
            package.json
            package-lock.json
